services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: forgeflow
      MYSQL_USER: forgeflow
      MYSQL_PASSWORD: forgeflow
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - forgeflow-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: node:22-slim
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://forgeflow:forgeflow@db:3306/forgeflow
      NODE_ENV: development
    command: >-
      bash -lc "corepack enable && pnpm install && pnpm dev"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - forgeflow-node-modules:/app/node_modules

volumes:
  forgeflow-db:
  forgeflow-node-modules:
