name: Deployment Readiness

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment approved in Forgeflow
        required: true
        default: staging
        type: choice
        options: [staging, production]

jobs:
  validate-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable && pnpm install --frozen-lockfile && pnpm test && pnpm check && pnpm build
      - name: Report provider boundary
        run: echo "Readiness verification completed. A configured deployment provider and approved Forgeflow gate are required before any remote deployment action."
